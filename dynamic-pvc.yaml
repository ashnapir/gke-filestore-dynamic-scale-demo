apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: filestore-zonal-rwx
provisioner: filestore.csi.storage.gke.io
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  tier: zonal
  network: "default" # Change to your VPC network name (e.g., "alec-vpc") if default is not available
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fio-dynamic-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: filestore-zonal-rwx
  resources:
    requests:
      storage: 1Ti # Minimum size for Zonal is 1TiB
